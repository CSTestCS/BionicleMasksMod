modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Every Kanoka disk and every Kanohi mask from BIONICLE, forged from vanilla materials.

Press Kanoka disks in the Kanoka Disk Forge, then melt them down in the Kanohi Mask Forge
to make masks - just like the mask makers of Ta-Metru.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
